[package]
name = "meshview"
version = "0.2.1"
edition = "2024"
description = "Headless CPU rasterizer for comparing triangle meshes side by side: one shared orthographic camera, coverage masks, deterministic PNG sheets"
authors = ["Ugo Garetto"]
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uvar-apps/meshview"
readme = "README.md"
keywords = ["obj", "mesh", "rasterizer", "comparison", "orthographic"]
categories = ["graphics", "rendering"]
# The two Stanford scan models (research/educational license, Turk/Levoy) are
# distributed via the GitHub repo only, not the crates.io package. The crambin
# SES mesh (molses, MIT OR Apache-2.0, from the unrestricted PDB 1CRN) ships
# so the published package still exercises the vn-binding path end to end.
exclude = ["assets/samples/stanford-bunny.obj", "assets/samples/xyzrgb_dragon.obj"]

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
objserde = "0.2.0"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
