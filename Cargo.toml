[package]
name = "meshview"
version = "0.1.0"
edition = "2024"
description = "Headless CPU rasterizer for comparing triangle meshes side by side"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uvar-apps/meshview"
readme = "README.md"
keywords = ["obj", "mesh", "rasterizer", "comparison", "orthographic"]
categories = ["graphics", "rendering"]

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
